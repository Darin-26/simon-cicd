apiVersion: apps/v1
kind: Deployment
metadata:
  name: simon-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simon-game
  template:
    metadata:
      labels:
        app: simon-game
    spec:
      containers:
        - name: simon-game
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 80
